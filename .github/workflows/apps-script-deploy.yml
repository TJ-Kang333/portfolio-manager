# Apps Script 자동 반영
#  main 에 apps-script/ 변경이 머지되면 → Apps Script 프로젝트에 코드 반영(clasp push)
#  → 기존 웹앱 배포를 새 버전으로 업데이트(URL 그대로, MacroDroid·앱 설정 변경 불필요).
#
#  안전장치: 반영 전에 Apps Script 에 실제로 올라가 있는 코드를 내려받아(clasp pull) 저장소 기록과 비교한다.
#   - 코드가 저장소의 예전 어느 버전과든 같으면 반영이 늦었을 뿐 → 진행.
#   - 어느 버전과도 다르면 편집기에서 직접 고친 것 → 덮어쓰지 않고 멈춘다.
#   - 매니페스트(appsscript.json)는 지금 저장소 것과 같아야 진행(웹앱 접근 설정 등이 바뀌지 않도록).
#
#  필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON               PC 에서 `clasp login` 후 생긴 .clasprc.json 내용 전체
#   APPS_SCRIPT_ID             Apps Script 편집기 → 프로젝트 설정 → 스크립트 ID
#   APPS_SCRIPT_DEPLOYMENT_ID  Apps Script 편집기 → 배포 → 배포 관리 → 웹앱 배포 ID
#
#  수동 실행(Actions 탭 → Apps Script 배포 → Run workflow):
#   check        Apps Script 의 현재 코드와 저장소를 비교만 함(반영 안 함). 처음 설정할 때 먼저 실행.
#   deploy       비교해서 같으면 지금 main 을 반영.
#   force-deploy 비교 없이 지금 main 으로 덮어써서 반영(편집기에서 고친 내용은 사라짐).
name: Apps Script 배포

on:
  push:
    branches: [main]
    paths: ['apps-script/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = 비교만 / deploy = 같으면 반영 / force-deploy = 비교 없이 덮어쓰기'
        type: choice
        options: [check, deploy, force-deploy]
        default: check

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
    steps:
      - name: 설정 확인
        id: cfg
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::warning::Secrets(CLASPRC_JSON / APPS_SCRIPT_ID / APPS_SCRIPT_DEPLOYMENT_ID)가 아직 없어서 건너뜀 — Apps Script 는 직접 붙여넣어 주세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: clasp 준비
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # PC 에서 로그인할 때와 같은 버전이어야 인증 파일 형식이 맞음
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Apps Script 의 현재 코드 내려받기
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/remote"
          cd "$RUNNER_TEMP/remote"
          printf '{"scriptId":"%s","rootDir":".","fileExtension":"gs"}' "$SCRIPT_ID" > .clasp.json
          clasp pull
          rm -f .clasp.json
          echo "Apps Script 에 있는 파일:"; ls -la

      - name: 비교 (편집기에서 직접 고친 내용이 있는지)
        if: steps.cfg.outputs.ready == 'true' && env.MODE != 'force-deploy'
        run: |
          R="$RUNNER_TEMP/remote"
          # Apps Script 는 파일 끝 줄바꿈을 지워서 저장 → 비교 전에 양쪽 모두 끝 줄바꿈을 맞춤
          norm() { find "$1" -type f \( -name '*.gs' -o -name '*.json' \) -exec sed -i -e '$a\' {} +; }
          norm "$R"

          # ① 코드(.gs): Apps Script 코드가 저장소의 예전 어느 버전과든 같으면 "직접 고친 게 아니라 반영이 늦은 것" → 진행.
          #    어느 버전과도 다르면 편집기에서 직접 고친 것 → 덮어쓰지 않고 멈춤.
          mkdir -p "$RUNNER_TEMP/r_gs"; cp "$R"/*.gs "$RUNNER_TEMP/r_gs/"
          MATCH=""
          for C in $(git log --format=%H -n 50 "$GITHUB_SHA" -- apps-script); do
            D="$RUNNER_TEMP/c_$C"; mkdir -p "$D"
            git archive "$C" apps-script | tar -x -C "$D"
            mkdir -p "$D/gs"; cp "$D"/apps-script/*.gs "$D/gs/" 2>/dev/null || true; norm "$D/gs"
            if diff -rq --strip-trailing-cr -B "$D/gs" "$RUNNER_TEMP/r_gs" > /dev/null; then MATCH="$C"; break; fi
          done
          if [ -n "$MATCH" ]; then
            if [ "$MATCH" = "$GITHUB_SHA" ] || [ -z "$(git diff --name-only "$MATCH" "$GITHUB_SHA" -- 'apps-script/*.gs')" ]; then
              echo "✓ Apps Script 의 코드가 지금 저장소와 같아요."
            else
              echo "✓ Apps Script 의 코드는 저장소의 예전 버전(${MATCH::7})과 같아요 — 직접 고친 내용 없음, 새 코드로 반영 가능."
            fi
          else
            echo "::error::Apps Script 의 코드가 저장소의 어느 버전과도 달라요 — 편집기에서 직접 고친 내용이 있어서 덮어쓰지 않고 멈춥니다. 아래는 지금 저장소와의 차이예요(- 저장소 / + Apps Script). 고친 내용을 저장소에 반영하거나, 버려도 되면 force-deploy 로 실행하세요."
            mkdir -p "$RUNNER_TEMP/h_gs"; cp apps-script/*.gs "$RUNNER_TEMP/h_gs/"; norm "$RUNNER_TEMP/h_gs"
            diff -r -u --strip-trailing-cr -B "$RUNNER_TEMP/h_gs" "$RUNNER_TEMP/r_gs" || true
            exit 1
          fi

          # ② 매니페스트(appsscript.json): 반영하면 저장소 것으로 덮어써지므로 지금 저장소와 같아야 함
          if [ ! -f apps-script/appsscript.json ]; then
            echo "::error::저장소에 apps-script/appsscript.json 이 없어요. 아래 Apps Script 매니페스트를 그대로 추가하세요."
            cat "$R/appsscript.json"; exit 1
          fi
          if jq -S . apps-script/appsscript.json > "$RUNNER_TEMP/m_repo.json" && jq -S . "$R/appsscript.json" > "$RUNNER_TEMP/m_remote.json" \
             && diff -u "$RUNNER_TEMP/m_repo.json" "$RUNNER_TEMP/m_remote.json"; then
            echo "✓ 매니페스트(appsscript.json)도 같아요."
          else
            echo "::error::Apps Script 의 매니페스트가 저장소와 달라요(위 차이: - 저장소 / + Apps Script). 저장소 것을 맞춘 뒤 다시 실행하세요."
            exit 1
          fi

      - name: 반영 (clasp push + 기존 배포 업데이트)
        if: steps.cfg.outputs.ready == 'true' && env.MODE != 'check'
        run: |
          if [ ! -f apps-script/appsscript.json ]; then
            echo "::error::저장소에 apps-script/appsscript.json 이 없어요. 먼저 check 모드로 실행해서 매니페스트를 추가하세요."
            exit 1
          fi
          printf '{"scriptId":"%s","rootDir":"apps-script","fileExtension":"gs"}' "$SCRIPT_ID" > .clasp.json
          clasp push -f
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "auto ${GITHUB_SHA::7}"
          rm -f .clasp.json
          echo "✓ 반영 완료 — 웹앱 URL 은 그대로예요."
